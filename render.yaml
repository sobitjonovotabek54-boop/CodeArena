services:
  - type: web
    name: codearena-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/problems/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      # Python bo'lmagan tillar uchun soxta "CODEARENA_SOLVED" testlarini o'chiradi
      - key: CODE_EXECUTION_ALLOW_MOCK
        value: "0"
      # Adminlar: "username:email:password" ko'rinishida, bir nechtasi vergul bilan.
      # Render deploy paytida bu qiymatni so'raydi (repoda saqlanmaydi).
      - key: ADMIN_USERS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: codearena-db
          property: connectionString

databases:
  - name: codearena-db
    plan: free
    region: oregon
