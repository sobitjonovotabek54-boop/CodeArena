services:
  # ---------- Backend: Django API (Docker) ----------
  - type: web
    name: codearena-otabek-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/problems/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      # Python bo'lmagan tillar uchun soxta "CODEARENA_SOLVED" testlarini o'chiradi
      - key: CODE_EXECUTION_ALLOW_MOCK
        value: "0"
      # Adminlar: "username:email:password" ko'rinishida, bir nechtasi vergul bilan.
      # Render deploy paytida bu qiymatni so'raydi (repoda saqlanmaydi).
      - key: ADMIN_USERS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: codearena-db
          property: connectionString

  # ---------- Frontend: Next.js ----------
  - type: web
    name: codearena-otabek
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm ci && npx next build
    startCommand: npx next start -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      # Backend manzili build paytida frontendga yoziladi.
      # Agar Render backendga boshqa manzil bersa, shu qiymatni o'zgartirib "Manual Deploy" qiling.
      - key: NEXT_PUBLIC_API_URL
        value: https://codearena-otabek-api.onrender.com/api

databases:
  - name: codearena-db
    plan: free
    region: oregon
